services:
  digital-twin:
    environment:
      DEPLOYMENT_PROFILE: PRODUCTION
      PRODUCTION_HARDENING: "true"
      AUTH_REQUIRED: "true"
      ENABLE_LOCAL_PERSONA: "false"
      SECRET_PROVIDER: FILE
      SECRET_FILE_DIRECTORY: /run/secrets
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?Set OIDC_JWKS_URI}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-roles}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL from the deployment secret store}
      TELEMETRY_MODE: LIVE
      OPERATING_MODE: LIVE
      ENABLE_LIVE_EXECUTION: "false"
      COMMAND_PROXY_GRPC_ENDPOINT: ${COMMAND_PROXY_GRPC_ENDPOINT:?Set COMMAND_PROXY_GRPC_ENDPOINT}
      COMMAND_PROXY_CA_FILE: /run/tls/ca.crt
      COMMAND_PROXY_CLIENT_CERT_FILE: /run/tls/tls.crt
      COMMAND_PROXY_CLIENT_KEY_FILE: /run/tls/tls.key
      SERVICENOW_INCIDENT_INGEST_ENABLED: ${SERVICENOW_INCIDENT_INGEST_ENABLED:-false}
      ENABLE_SERVICENOW_WORK_NOTES: ${ENABLE_SERVICENOW_WORK_NOTES:-false}
      SOLARWINDS_ENABLED: ${SOLARWINDS_ENABLED:-false}
      CISCO_CATALYST_CENTER_ENABLED: ${CISCO_CATALYST_CENTER_ENABLED:-false}
      CISCO_SDWAN_ENABLED: ${CISCO_SDWAN_ENABLED:-false}
      FIREWALL_CONNECTORS_ENABLED: ${FIREWALL_CONNECTORS_ENABLED:-false}
    secrets:
      - COMMAND_PROXY_ACCESS_TOKEN
    volumes:
      - ${COMMAND_PROXY_TLS_DIRECTORY:?Set COMMAND_PROXY_TLS_DIRECTORY}:/run/tls:ro
    ports: []

secrets:
  COMMAND_PROXY_ACCESS_TOKEN:
    external: true
